---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{{ page.body_class | escape }}{% if site.visitor_map.embed_url != '' and site.visitor_map.embed_url %} has-visitor-map{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
        {% include visitor-map.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
